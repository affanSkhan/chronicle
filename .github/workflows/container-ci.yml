name: Container CI

on:
  push:
    paths:
      - "apps/web/Dockerfile"
      - "apps/web/**"
      - "services/api/Dockerfile"
      - "services/api/**"
      - "infra/docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/container-ci.yml"
  pull_request:
    paths:
      - "apps/web/Dockerfile"
      - "apps/web/**"
      - "services/api/Dockerfile"
      - "services/api/**"
      - "infra/docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/container-ci.yml"

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build API image
        run: docker build -f services/api/Dockerfile services/api
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 .
