services:
  postgres:
    image: postgres:16-alpine
    container_name: chronicle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronicle-local-only}
    ports:
      - "5432:5432"
    volumes:
      - chronicle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle -d chronicle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chronicle_pgdata:
